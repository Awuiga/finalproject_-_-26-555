name: Update terminal demo GIF
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-terminal-demo.yml
      - docs/_generate_demo.py
permissions:
  contents: write
jobs:
  update-gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Render GIF
        run: python docs/_generate_demo.py
      - name: Commit updated GIF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/valutatrade_demo.gif
          if ! git diff --cached --quiet; then
            git commit -m "финалочка"
            git push origin HEAD:main
          fi
